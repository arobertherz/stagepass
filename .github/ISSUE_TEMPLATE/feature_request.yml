name: Feature request
description: Suggest an enhancement for the CLI, loader, or modules
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and the change you would like. Keep the scope focused.
        Do not include secrets, tokens, private URLs, or credentials.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Keep it additive and non-breaking within v2 when possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about (optional).
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Loader
        - Modules
        - Docs / repo
        - Other
    validations:
      required: true

  - type: checkboxes
    id: no-secrets
    attributes:
      label: Secrets
      options:
        - label: I have not included secrets, tokens, private credentials, or sensitive URLs in this request.
          required: true
