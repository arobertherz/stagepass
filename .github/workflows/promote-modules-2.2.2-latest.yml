# Manual-only dist-tag promotion: @stagepass/modules@2.2.2 -> latest.
# Does not publish a package, create tags, or change versions. Keeps next untouched.
name: Promote modules 2.2.2 latest

on:
  workflow_dispatch:

concurrency:
  group: promote-modules-2.2.2-latest
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'arobertherz/stagepass'
    runs-on: [self-hosted, cerebro]
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Promote @stagepass/modules@2.2.2 to latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG: '@stagepass/modules'
          VER: '2.2.2'
          EXPECTED_PREDECESSOR_LATEST: '2.2.0'
          EXPECTED_HEAD: 'd531d300a9a793618ecc9230328d3db6f7cb7cd0'
          EXPECTED_INTEGRITY: 'sha512-Tw0d0ospZV7QfGOgL+fR9vFYzSEXQeInQfmlnf4kqEHxuor/PGlL8AG1vzim5YCK47mGo0BUjlp29w9PeUSF8Q=='
        run: |
          set -euo pipefail

          assert_pkg() {
            local label="$1"
            export LABEL="$label"
            npm view "${PKG}@${VER}" --json | node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
              const label = process.env.LABEL;
              const ver = process.env.VER;
              const head = process.env.EXPECTED_HEAD;
              const integrity = process.env.EXPECTED_INTEGRITY;
              const gotVer = pkg.version || "";
              const gotHead = pkg.gitHead || "";
              const gotIntegrity = (pkg.dist && pkg.dist.integrity) || "";
              if (gotVer !== ver) {
                console.error(label + ": version want " + ver + " got " + gotVer);
                process.exit(1);
              }
              if (gotHead !== head) {
                console.error(label + ": gitHead want " + head + " got " + gotHead);
                process.exit(1);
              }
              if (gotIntegrity !== integrity) {
                console.error(label + ": integrity mismatch");
                process.exit(1);
              }
              console.log(label + ": package " + ver + " ok");
            '
          }

          assert_tags() {
            local label="$1"
            local want_latest="$2"
            export LABEL="$label"
            export WANT_LATEST="$want_latest"
            npm view "${PKG}" dist-tags --json | node -e '
              const fs = require("fs");
              const tags = JSON.parse(fs.readFileSync(0, "utf8"));
              const label = process.env.LABEL;
              const wantLatest = process.env.WANT_LATEST;
              const wantNext = process.env.VER;
              if (tags.next !== wantNext) {
                console.error(label + ": next want " + wantNext + " got " + String(tags.next));
                process.exit(1);
              }
              if (tags.latest !== wantLatest) {
                console.error(label + ": latest want " + wantLatest + " got " + String(tags.latest));
                process.exit(1);
              }
              console.log(label + ": tags latest=" + tags.latest + " next=" + tags.next);
            '
          }

          assert_pkg pre-package

          CURRENT_LATEST="$(npm view "$PKG" dist-tags.latest)"
          CURRENT_NEXT="$(npm view "$PKG" dist-tags.next)"
          if [[ "$CURRENT_NEXT" != "$VER" ]]; then
            echo "pre: next must remain ${VER} (got ${CURRENT_NEXT})" >&2
            exit 1
          fi

          if [[ "$CURRENT_LATEST" == "$VER" ]]; then
            echo "latest already ${VER}; no mutation"
            assert_pkg noop-package
            assert_tags noop-tags "$VER"
            exit 0
          fi

          if [[ "$CURRENT_LATEST" != "$EXPECTED_PREDECESSOR_LATEST" ]]; then
            echo "pre: refuse unexpected latest=${CURRENT_LATEST}; want noop ${VER} or predecessor ${EXPECTED_PREDECESSOR_LATEST}" >&2
            exit 1
          fi

          echo "pre: latest=${CURRENT_LATEST} next=${CURRENT_NEXT}; adding ${PKG}@${VER} latest"
          npm dist-tag add "${PKG}@${VER}" latest

          assert_pkg post-package
          assert_tags post-tags "$VER"
          echo "promotion complete: latest=${VER} next=${VER} integrity/head unchanged"
