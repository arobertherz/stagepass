name: Release

on:
  push:
    tags:
      - 'cli-v*'
      - 'loader-v*'
      - 'modules-v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Package release ref (cli-vX, loader-vX, or modules-vX)
        required: true
        type: string

jobs:
  stage:
    # Only publish from the canonical public repo
    if: github.repository == 'arobertherz/stagepass'
    runs-on: [self-hosted, cerebro]
    permissions:
      contents: read
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}

    steps:
      - name: Validate release ref
        run: |
          if [[ ! "$RELEASE_REF" =~ ^(cli|loader|modules)-v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$ ]]; then
            echo "Not a package release ref" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_REF }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Ensure npm >= 11.15.0
        run: |
          npm install -g 'npm@^11.15.0'
          npm --version
          node -e "const [maj,min,pat]=process.versions.node.split('.').map(Number); if (maj<22 || (maj===22 && min<14)) { console.error('Need Node >= 22.14.0'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run CLI tests
        run: npm test --workspace=packages/cli

      - name: Run Loader tests
        run: npm test --workspace=packages/loader

      - name: Run Modules tests
        run: npm test --workspace=packages/modules

      - name: Packed CLI smoke test (npm pack, global install, new + install + build)
        run: node scripts/test-cli-packed.mjs

      - name: Verify package tag matches the selected package version
        id: versions
        run: node scripts/check-release-version.mjs "$RELEASE_REF"

      - name: Require selected package
        if: steps.versions.outputs.stage_dir == ''
        run: exit 1

      # npm provenance (--provenance) requires a supported cloud CI OIDC
      # environment. Self-hosted runners are not supported, so we omit it.
      - name: Stage the selected package
        if: steps.versions.outputs.stage_dir != ''
        working-directory: packages/${{ steps.versions.outputs.stage_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.versions.outputs.dist_tag }}
        run: npm stage publish --tag "$DIST_TAG" --access public

      - name: List staged packages
        if: steps.versions.outputs.stage_dir != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          STAGE_DIR: ${{ steps.versions.outputs.stage_dir }}
        run: (cd "packages/$STAGE_DIR" && npm stage list)
