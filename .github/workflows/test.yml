name: Tests

on:
  push:
    # release/** and fix/** run on push only, deliberately not on pull_request.
    branches: [master, main, 'release/**', 'fix/**']
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: [self-hosted, cerebro]

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run CLI tests
        run: npm test --workspace=packages/cli

      - name: Run Loader tests
        run: npm test --workspace=packages/loader

      - name: Run Modules tests
        run: npm test --workspace=packages/modules

      - name: Packed CLI smoke test (npm pack, global install, new + install + build)
        run: node scripts/test-cli-packed.mjs
