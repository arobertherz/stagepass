name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: [self-hosted, cerebro]

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Run CLI tests
        run: npm test --workspace=packages/cli

      - name: Run Loader tests
        run: npm test --workspace=packages/loader

      - name: Run Modules tests
        run: npm test --workspace=packages/modules

      - name: Packed CLI smoke test (npm pack, global install, new + install + build)
        run: node scripts/test-cli-packed.mjs

  e2e:
    runs-on: [self-hosted, cerebro]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright (Chromium only)
        working-directory: e2e
        run: npx playwright test --project=chromium
