name: CDN

# Self-hosted runner name: cerebro-stagepass
# Labels: self-hosted, linux, arm64, cerebro
# runs-on matches the other workflows in this repo.
#
# Wrangler 4.165.0 is the exact version from `npm view wrangler version`
# in node:22 on 2026-11-20. Refresh the pin with npm view before changing it.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - staging
          - production
  push:
    branches: [master]
    paths:
      - 'cdn/**'
  schedule:
    # UTC. Staging only, and only when npm has a selected version the live manifest lacks.
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: cdn-${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    # Canonical repo only. Forks must not deploy.
    if: github.repository == 'stagepass-one/os'
    runs-on: [self-hosted, cerebro]
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decide whether staging should deploy
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          line="$(node cdn/scripts/pending-versions.mjs --manifest-url https://staging-cdn.stagepass.one/manifest.json)"
          printf '%s\n' "$line"
          case "$line" in
            pending=true)
              echo "deploy=true" >> "$GITHUB_OUTPUT"
              ;;
            pending=false)
              echo "::notice::No selected npm versions are missing from the staging manifest. Skipping staging deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::Could not compare npm versions with the staging manifest. Skipping staging deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  unit:
    needs: plan
    if: github.repository == 'stagepass-one/os' && needs.plan.outputs.deploy == 'true'
    runs-on: [self-hosted, cerebro]
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: CDN worker tests
        run: node --test cdn/test

  deploy-staging:
    needs: [plan, unit]
    if: github.repository == 'stagepass-one/os' && needs.plan.outputs.deploy == 'true'
    runs-on: [self-hosted, cerebro]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set. Skipping CDN deploy."
            exit 0
          fi
          echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set before a manual CDN deploy." >&2
          exit 1

      - name: Build CDN assets from npm
        if: steps.creds.outputs.present == 'true'
        run: node cdn/scripts/build-assets.mjs

      - name: Deploy staging
        if: steps.creds.outputs.present == 'true'
        working-directory: cdn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.165.0 deploy --env staging

      - name: Verify staging
        if: steps.creds.outputs.present == 'true'
        run: node cdn/scripts/verify-live.mjs https://staging-cdn.stagepass.one --all --local cdn/dist/manifest.json --registry

  deploy-production:
    needs: deploy-staging
    if: github.repository == 'stagepass-one/os' && github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' && needs.deploy-staging.result == 'success'
    runs-on: [self-hosted, cerebro]
    timeout-minutes: 30
    environment: cdn-production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set for production." >&2
            exit 1
          fi

      - name: Build CDN assets from npm
        run: node cdn/scripts/build-assets.mjs

      - name: Deploy production
        working-directory: cdn
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.165.0 deploy --env production

      - name: Verify production
        run: node cdn/scripts/verify-live.mjs https://cdn.stagepass.one --all --local cdn/dist/manifest.json --registry
